[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bird-reproduction"
version = "0.1.0"
description = "Modern PyTorch reproduction of BIRD (ICDE 2023)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2.0",
  "pandas>=2.0",
  "scipy>=1.10",
  "openpyxl>=3.1",
  "matplotlib>=3.7",
  "torch>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bird-reproduce = "experiments.reproduce_icde:main"
bird-plot = "experiments.plot_icde:main"
bird-train-ddpg = "experiments.train_ddpg:main"

[tool.setuptools.packages.find]
include = ["bird*", "experiments*"]
